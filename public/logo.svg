<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090B0E" stroke="#222733" stroke-width="2" />
  
  <!-- Subtle Glow Node -->
  <circle cx="50" cy="14" r="10" fill="#00F0FF" fill-opacity="0.25" filter="blur(4px)" />

  <!-- Monogram AC Text -->
  <text x="13" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="27" letter-spacing="-1.5">
    <tspan fill="url(#favGrad)">A</tspan>
    <tspan fill="#FFFFFF">C</tspan>
  </text>
  
  <!-- Live Pulse Dot -->
  <circle cx="50" cy="38" r="3.5" fill="#00F0FF" />
</svg>
